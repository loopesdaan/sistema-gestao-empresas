name: CI/CD Pipeline

on:
  push:
    branches:
      - master
      - dev
  pull_request:
    branches:
      - master
      - dev

jobs:
  validate-origin:
    name: Validar Origem do PR
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    steps:
      - name: Validar se a origem é estritamente a branch dev
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "::error::Política de Branches violada: A branch 'master' só pode receber Pull Requests vindos da branch 'dev'! Origem atual detectada: '${{ github.head_ref }}'."
            exit 1
          fi
          echo "Origem autorizada com sucesso: O PR veio estritamente da branch 'dev'."

  backend-ci:
    name: Backend Lint & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Syntax and byte-compile verification
        run: |
          python -m compileall backend/app

      - name: Verify FastAPI startup (Dry Run)
        run: |
          cd backend
          python -c "import os; os.environ['DATABASE_URL']='sqlite:///:memory:'; os.environ['ENVIRONMENT']='development'; from app.main import app; print('FastAPI App loaded successfully.')"

  frontend-ci:
    name: Frontend TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Typecheck and Build Frontend
        run: |
          cd frontend
          npm run build

